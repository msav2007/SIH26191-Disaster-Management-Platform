services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: sih26191-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: disaster_management
      POSTGRES_USER: disaster_admin
      POSTGRES_PASSWORD: disaster_admin
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U disaster_admin -d disaster_management']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

